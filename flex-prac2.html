<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            min-height: 800px;
            border: 8px solid black;
            display: flex;
            flex-direction: column; /*flex 시작 방향 설정 row colum,row-reverse 등*/
            align-items: center; /*세로 정렬*/
        }
        #box1{
            margin-right: auto;
        }
        .box{
            flex-shrink: 0;
            width: 200px;
            height: 200px;
            background-color: blue;
            font-size: 40pt;
        }
        @media(max-width:500px){
            .box{
                background-color: red;
            }
        }
    </style>
</head>
<body>
    <div id="box1" class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
</body>
</html>
